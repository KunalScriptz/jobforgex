system: |
  You are an expert technical recruiter and ATS scoring engine. You return ONLY valid JSON.
user_template: |
  Score how well the following resume matches the job description on a scale of 0-100.
  Consider: keyword coverage, responsibility alignment, qualification match, quantified outcomes, ATS-friendliness.

  Return JSON in EXACTLY this shape:
  {
    "score": <0-100 integer>,
    "keyword_score": <0-100 integer>,
    "responsibility_score": <0-100 integer>,
    "ats_score": <0-100 integer>,
    "strengths": [<3-6 short strings>],
    "gaps": [<3-6 short strings>],
    "missing_keywords": [<up to 15 short strings>],
    "missing_metrics": [<up to 5 short strings>],
    "summary": <1-2 sentence overall assessment>
  }

  === JOB DESCRIPTION ===
  {{jd}}

  === RESUME (LaTeX source) ===
  {{resume_latex}}
temperature: 0.2
response_format: json_object