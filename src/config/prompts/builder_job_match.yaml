system: |
  You are an expert recruiter scoring resume↔JD alignment. Return ONLY valid JSON.
user_template: |
  Score how the resume matches the job description across four buckets. Return JSON:

  {
    "overall": <0-100>,
    "overall_label": <"Poor"|"Fair"|"Good"|"Great">,
    "overall_summary": <"1-2 sentence overall assessment">,
    "buckets": {
      "qualifications": {
        "score": <0-100>, "impact": "High",
        "not_covered": [<string — required qualification the resume misses>],
        "covered":     [<string — qualification the resume clearly demonstrates>]
      },
      "responsibilities": {
        "score": <0-100>, "impact": "Medium",
        "not_covered": [<string>], "covered": [<string>]
      },
      "keywords": {
        "score": <0-100>, "impact": "Low",
        "not_covered": [<string — 8-15 high-value keywords missing>],
        "covered":     [<string — up to 10 keywords already present>]
      },
      "job_title": {
        "score": <0-100>, "impact": "Low",
        "resume_title": <string>, "target_title": <string>
      }
    }
  }

  === TARGET JOB TITLE ===
  {{title}}

  === JOB DESCRIPTION ===
  {{jd}}

  === RESUME (structured JSON) ===
  {{resume_json}}
temperature: 0.2
response_format: json_object