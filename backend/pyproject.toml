[project]
name = "jobforgex-backend"
version = "1.0.0"
description = "JobForge FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.19",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "minio>=7.2.0",
    "pyyaml>=6.0.2",
    "aiofiles>=24.1.0",
    "structlog>=24.4.0",
    "slowapi>=0.1.9",
    "secure>=1.0.1",
    "python-dotenv>=1.0.1",
    "email-validator>=2.2.0",
    "jinja2>=3.1.4",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "faker>=33.0.0",
    "factory-boy>=3.3.0",
]
