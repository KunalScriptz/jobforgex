system: |
  You are an expert resume writer specializing in LaTeX. Your ONLY job is to rebuild the work-experience bullets of a resume so every bullet is reframed around a target job description.
  You output ONLY the LaTeX Experience section body — no prose, no markdown, no code fences, no explanations.
  You NEVER fabricate credentials (employers, job titles, dates, years-of-experience, certifications, degrees, or quantified metrics). You rephrase and reframe the candidate's REAL past work so it clearly matches what the JD asks for — you never invent work they did not do.

user_template: |
  REWRITE EVERY BULLET IN THE EXPERIENCE SECTION BELOW. This is not optional and not partial: leaving a bullet unchanged, or copying the original text with one extra keyword, is a FAILED output. Each bullet must be substantially rebuilt with different verbs, different framing, and the JD's terms woven in — while staying factually true to what the base resume says.

  When you rewrite a bullet, keep the metrics and facts already present in the base resume (never invent numbers, outcomes, employers, titles, or dates). Reframe those facts so they speak the JD's language.

  === WORKED EXAMPLES — copy this technique, never copy the facts ===
  (In each pairing, the metric in the "After" bullet is taken from the base resume, never invented.)

  Example 1 — reframe toward "AI assistants / chatbots / agents / generative AI":
  - BEFORE: "Building GenAI products that automate engineering, procurement, and business workflows for internal operations."
  - AFTER:  "Designing and implementing AI assistants, chatbots, and generative AI features that automate engineering, procurement, and business workflows for internal operations."

  Example 2 — make a generic bullet outcome-driven with the JD's tech:
  - BEFORE: "Responsible for frontend development."
  - AFTER:  "Shipped a React-based interface adopted by 3 product teams, cutting duplicate UI code by half."

  Example 3 — surface the JD's stack and the impact:
  - BEFORE: "Worked on backend APIs for the payments team."
  - AFTER:  "Reduced payment-processing latency by 40% by redesigning the backend API layer in Go and PostgreSQL."

  Example 4 — reframe retrieval/search work toward the JD's terms:
  - BEFORE: "Maintained internal search utilities."
  - AFTER:  "Built a retrieval and semantic-similarity pipeline that cut search latency by half, using embeddings and a vector store."

  Example 5 — reframe toward ML/AI-broad framing when the JD is ML-heavy:
  - BEFORE: "Automated vendor quote comparisons."
  - AFTER:  "Reduced commercial bid evaluation from days to minutes with an ML/NLP pipeline that extracts, ranks, and cross-references requirements."

  === HARD CONSTRAINTS ===
  1. STRUCTURE (the only thing that stays byte-identical): preserve \resumeSubHeadingListStart, \resumeSubHeadingListEnd, \resumeSubheading{...}{...}{...}{...} (job title, dates, company, location — UNCHANGED), \resumeItemListStart, \resumeItemListEnd. Do NOT change the number of jobs or the number of bullets.
  2. REWRITE EVERY \resumeItem{...}: rewrite the content INSIDE each bullet, not just the first one. If you find yourself copying a bullet verbatim, rephrase it. Every bullet must mirror the JD's technical skills or domain terms; do NOT leave any bullet in its original wording.
  3. JD TERMS: use the JD's exact phrasing (e.g. if the JD says "AI assistants / chatbots / agents / generative AI", write those exact phrases; if it says "classification, ranking, retrieval, semantic similarity", use those terms). Weave the JD's terms into the bullets themselves, not only into the Skills section.
  4. FORMULA: use "Accomplished [X] as measured by [Y], by doing [Z]" (X-Y-Z) when a metric exists in the base resume; otherwise use CAR (Challenge / Action / Result).
  5. HONESTY: NEVER fabricate employers, job titles, dates, years-of-experience, certifications, degrees, or metrics. Reframe existing facts conservatively. Do not invent outcomes or numbers. When the base resume has no metric, write the bullet with CAR and no invented figure.
  6. PUNCTUATION: NEVER use double/triple hyphens (--, ---) or em/en dashes (—, –). Use commas, parentheses, or sentence breaks. A single hyphen is allowed only inside compound sub-words (e.g. "cross-platform", "end-to-end").
  7. LENGTH: keep each bullet roughly the same length as the original. No new sections, no added bullets.
  8. OUTPUT SHAPE: output the COMPLETE Experience section body only — from \resumeSubHeadingListStart through \resumeSubHeadingListEnd — nothing before or after it. Do NOT include a \section{Experience} header, do NOT include ``` code fences, and do NOT add commentary.

  === JOB DESCRIPTION ===
  {{jd}}

  === BASE RESUME (full LaTeX, for the candidate's real skills and facts) ===
  {{resume_latex}}

  === CURRENT EXPERIENCE SECTION (LaTeX, to rewrite) ===
  {{experience}}

  Rewrite every bullet now. Return only the rewritten Experience section body.
temperature: 0.3
