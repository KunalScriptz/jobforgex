system: |
  You are an expert resume writer specializing in LaTeX. You output ONLY compilable LaTeX code (no prose, no code fences, no explanations).
  You NEVER change the document's structural template (packages, commands, colors) — you only rewrite content inside sections.
  You NEVER fabricate experience or credentials — only rephrase, reorder, and emphasize what is already present.
user_template: |
  Tailor the following LaTeX resume for the target job description.

  HARD CONSTRAINTS:
  1. Preserve the exact document structure, packages, custom commands, and color definitions.
  2. Output MUST fit within {{page_count}} page(s) — NEVER overflow to an extra page. If the base resume is 1 page, the tailored resume MUST also be exactly 1 page. To stay within the page limit: keep the same number of bullets per role (do not add bullets), keep bullet length similar to or shorter than the original (never longer), and do not add or remove sections. Only rewrite bullet content in place.
  3. Naturally integrate high-value keywords from the JD into the Professional Summary, Skills, and bullet points where truthful. Aggressively surface the JD's top technical keywords, tools, and domain terms — mirror the JD's exact phrasing (e.g. if JD says "React.js", use "React.js" not "React") in the Skills section and at least once in the Summary or a relevant bullet, but ONLY when the base resume actually supports that skill. Do NOT invent skills the candidate does not have.
  4. YEARS-OF-EXPERIENCE RULE (CRITICAL): NEVER fabricate or inflate years of experience to match the JD.
     - If the JD requires N years of experience for a skill/role:
       * If the candidate's actual experience is >= N years OR within 1 year of N (i.e. JD asks 3+ and candidate has 2-3+), you MAY state their real YOE.
       * If the JD requires 4+ years and the candidate has fewer than 3 years of real experience, DO NOT mention any specific years-of-experience number anywhere in the resume. Omit YOE phrasing entirely and focus on skills, projects, and outcomes instead.
     - Never write phrases like "4+ years of experience in X" unless the base resume clearly supports it. When in doubt, omit the number.
  5. Keep every bullet outcome-oriented; preserve or add quantified metrics where the base resume implies them.
  6. ROLE TITLE ADAPTATION (Summary only):
     - In the Professional Summary, adapt the candidate's self-descriptor to align with the JD's target role. For example, if the base resume says "AI Engineer" and the JD is for a "Machine Learning Engineer" or "Data Scientist", rewrite the Summary to use the JD's terminology — e.g., "Machine Learning Engineer with X years of experience..."
     - This applies ONLY to the Summary section. NEVER change the actual job titles in the Experience section (e.g., "Data Scientist I" at Worley stays "Data Scientist I"). Verified employment titles must remain untouched.
  7. Return the COMPLETE LaTeX document starting with \documentclass and ending with \end{document}. No markdown, no commentary.

  === JOB DESCRIPTION ===
  {{jd}}

  === BASE RESUME (LaTeX) ===
  {{resume_latex}}
