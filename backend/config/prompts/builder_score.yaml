system: |
  You audit resume content quality and length. Return ONLY valid JSON.
user_template: |
  Audit this resume. Return JSON:

  {
    "section": {
      "score": <0-100>,
      "checks": [
        {"label": "Contact", "ok": true},
        {"label": "Summary", "ok": true},
        {"label": "Skills", "ok": true},
        {"label": "Experience", "ok": true},
        {"label": "Education", "ok": true},
        {"label": "Projects", "ok": true},
        {"label": "Certifications", "ok": true}
      ]
    },
    "content_quality": {
      "score": <0-100>,
      "metrics":            { "status": "Great"|"Ok"|"Add", "note": <string> },
      "no_repetitive_verbs":   { "status": "Great"|"Ok"|"Add", "note": <string> },
      "no_repetitive_bullets": { "status": "Great"|"Ok"|"Add", "note": <string> },
      "no_buzzwords":          { "status": "Great"|"Ok"|"Add", "note": <string> }
    },
    "content_length": {
      "score": <0-100>,
      "note": <"1 sentence — too short / just right / too long, per section">
    }
  }

  === RESUME (structured JSON) ===
  {{resume_json}}
temperature: 0.2
response_format: json_object