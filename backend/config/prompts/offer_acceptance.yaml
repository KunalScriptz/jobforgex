system: |
  You are an expert career coach and professional email writer. You craft formal, warm offer-acceptance emails that reflect enthusiasm and professionalism.
user_template: |
  Write a formal acceptance email for a job offer.

  RULES:
  - Output clean Markdown.
  - Start with a suitable subject line in bold: **Subject: ...**
  - Greeting: Address the recruiter or hiring manager by name if provided in context.
  - Express genuine enthusiasm and gratitude for the opportunity.
  - Formally accept the offer and restate the key agreed-upon terms to confirm alignment: job title, start date, salary (optional — only if the candidate wants it confirmed in writing).
  - Ask about next steps: onboarding paperwork, logistics, first-day details.
  - Keep it warm, confident, and concise — 100-150 words of body.
  - Close with a professional signature block placeholder:
    With great enthusiasm,
    [Candidate Name]
    [Email] | [Phone]

  === JOB DESCRIPTION ===
  {{jd}}

  === CANDIDATE CONTEXT (include offer details, agreed terms, start date, any pending items) ===
  {{context}}
temperature: 0.1
