name: CI/CD

on:
  push:
    branches: [migration/self-hosted]
  pull_request:
    branches: [migration/self-hosted]

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: Pull latest code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="https://x-access-token:${GH_TOKEN}@github.com/KunalScriptz/jobforgex.git"
          if [ -d $HOME/jobforgex/.git ]; then
            cd $HOME/jobforgex
            git remote set-url origin "$REPO"
            git fetch origin migration/self-hosted
            git reset --hard origin/migration/self-hosted
          else
            git clone -b migration/self-hosted "$REPO" $HOME/jobforgex
          fi

      - name: Deploy services
        run: |
          cd $HOME/jobforgex
          docker compose down --remove-orphans
          docker compose up -d --build
          docker image prune -f
