name: CI/CD

on:
  push:
    branches: [migration/self-hosted]
  pull_request:
    branches: [migration/self-hosted]

jobs:
  deploy:
    runs-on: [self-hosted, jobforge-runner]
    steps:
      - name: Pull latest code
        run: |
          if [ -d /home/ghostops/ghostops_workspace/jobforgex ]; then
            cd /home/ghostops/ghostops_workspace/jobforgex
            git pull origin migration/self-hosted
          else
            git clone -b migration/self-hosted https://github.com/KunalScriptz/jobforgex.git /home/ghostops/ghostops_workspace/jobforgex
            cd /home/ghostops/ghostops_workspace/jobforgex
          fi

      - name: Deploy services
        run: |
          cd /home/ghostops/ghostops_workspace/jobforgex
          docker compose down --remove-orphans
          docker compose up -d --build
          docker image prune -f
