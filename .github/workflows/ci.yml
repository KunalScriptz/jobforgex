name: CI/CD

on:
  push:
    branches: [migration/self-hosted]
  pull_request:
    branches: [migration/self-hosted]

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: Pull latest code
        run: |
          if [ -d $HOME/jobforgex ]; then
            cd $HOME/jobforgex
            git pull origin migration/self-hosted
          else
            git clone -b migration/self-hosted https://github.com/KunalScriptz/jobforgex.git $HOME/jobforgex
            cd $HOME/jobforgex
          fi

      - name: Deploy services
        run: |
          cd $HOME/jobforgex
          docker compose down --remove-orphans
          docker compose up -d --build
          docker image prune -f
