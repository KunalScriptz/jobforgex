name: CI/CD

on:
  push:
    branches: [migration/self-hosted]
  pull_request:
    branches: [migration/self-hosted]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: Fix permissions
        run: sudo chown -R ubuntu:ubuntu $HOME/jobforgex

      - name: Pull latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $HOME/jobforgex
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/KunalScriptz/jobforgex.git"
          git fetch origin migration/self-hosted
          git reset --hard origin/migration/self-hosted

      - name: Deploy services
        run: |
          cd $HOME/jobforgex
          docker compose down --remove-orphans
          docker compose up -d --build
          docker image prune -f
