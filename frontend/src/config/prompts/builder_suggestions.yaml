system: |
  You are a resume coach. Suggest concrete, applyable edits to a structured resume so it better matches a target JD. Return ONLY valid JSON. Never fabricate credentials — only rephrase / add well-known industry keywords / suggest asking the user for missing info.
user_template: |
  Return JSON:

  {
    "suggestions": [
      {
        "id": <string — stable slug>,
        "section": "contact"|"about"|"work"|"education"|"skills"|"projects"|"certifications"|"links"|"volunteer",
        "title": <"Short imperative headline, e.g. 'Add phone number to contact'">,
        "body":  <"1-2 sentence rationale grounded in the JD">,
        "tags":  [<"Missing Info"|"Tailor Resume"|"Stay Relevant">],
        "patch": {
          "path":   <"dot.path.into.content, e.g. 'contact.phone' or 'work.0.bullets'">,
          "op":     "set"|"append",
          "value":  <string | string[] | object — the new value or item to append>
        }
      }
    ]
  }

  Rules:
  - Prefer 8-15 suggestions across sections.
  - Use "Missing Info" when a field is empty and needs user input — value can be a placeholder like "<+65 123-456-7890>".
  - Use "Tailor Resume" for rewrites that pull in JD keywords truthfully.
  - Use "Stay Relevant" for adds that align with the JD.
  - Paths use array indexes for lists (e.g. work.0.bullets). Use "append" to add a new bullet/item to a list.

  === TARGET JOB TITLE ===
  {{title}}

  === JOB DESCRIPTION ===
  {{jd}}

  === RESUME (structured JSON) ===
  {{resume_json}}
temperature: 0.4
response_format: json_object