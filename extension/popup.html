<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; width: 300px; padding: 14px; color: #0f172a; }
      .brand { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
      .brand img { width:28px; height:28px; }
      h1 { font-size: 15px; margin: 0; }
      p  { font-size: 12px; color: #64748b; margin: 0 0 12px; }
      label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#475569; margin-bottom:4px; }
      input { width:100%; box-sizing:border-box; padding:7px 9px; border:1px solid #cbd5e1; border-radius:6px; font-size:12px; margin-bottom:10px; }
      button { width:100%; padding:8px 10px; border-radius:6px; border:none; background:#0f172a; color:white; font-weight:600; cursor:pointer; font-size:12px; }
      button.secondary { background:transparent; color:#0f172a; border:1px solid #cbd5e1; margin-top:6px; }
      .row { display:flex; gap:8px; align-items:center; font-size:11px; color:#64748b; margin-top:10px; }
      .ok { color:#059669; }
      .err { color:#dc2626; }
      code { font-size:11px; background:#f1f5f9; padding:2px 4px; border-radius:3px; }
    </style>
  </head>
  <body>
    <div class="brand"><img src="icon-32.png" alt="" /><h1>JobForge</h1></div>
    <p>Connect this browser to your JobForge workspace.</p>
    <label for="host">Host</label>
    <input id="host" placeholder="http://localhost:8000" />
    <label for="token">Personal token</label>
    <input id="token" placeholder="jfx_..." />
    <button id="save">Save connection</button>
    <button id="test" class="secondary">Test connection</button>
    <div class="row" id="status"></div>
    <p style="margin-top:12px">Generate a token in Settings → Chrome extension.</p>
    <script src="popup.js"></script>
  </body>
</html>
